name: Deploy typed-voice to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Kanalizer Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.85.0
          mkdir -p "$RUNNER_TEMP/wasm-pack-bin"
          curl -L --fail --retry 3 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/wasm-pack.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          install \
            "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack" \
            "$RUNNER_TEMP/wasm-pack-bin/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack-bin" >> "$GITHUB_PATH"

      - name: Build patched Kanalizer browser WASM on CPU
        run: npm run build:kanalizer-wasm

      - name: Build Kanalizer v3 dictionary on CPU
        env:
          KANALIZER_DATASET_REVISION: 21fc9ccf25d3b18030d3e0db3bf5994229fae697
        run: |
          curl -L --fail --retry 3 \
            "https://huggingface.co/datasets/VOICEVOX/kanalizer-dataset/resolve/${KANALIZER_DATASET_REVISION}/dataset/dataset.jsonl" \
            -o "$RUNNER_TEMP/kanalizer-dataset-v3.jsonl"
          node scripts/build-kanalizer-dictionary.mjs \
            "$RUNNER_TEMP/kanalizer-dataset-v3.jsonl" \
            src/kanalizer-dictionary

      - name: Run tests
        run: npm test

      - name: Build production app, Voice PoC, and source cache map
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
